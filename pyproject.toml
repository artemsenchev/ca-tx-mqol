[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-tx-mqol"
version = "0.1.0"
description = "Price-adjusted material quality of life among California-to-Texas movers"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ken Xiong" },
    { name = "Artem Senchev" },
    { name = "Sam Der" },
    { name = "Pedro Jose Palacios" },
]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",       # parquet
    "ipumspy>=0.5",        # DDI + fixed-width extract reader
    "statsmodels>=0.14",   # WLS with cluster-robust covariance
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbstripout>=0.7",
    "ruff>=0.5",
]
paper = [
    "pypandoc-binary>=1.13",  # bundles pandoc; the PDF also needs a LaTeX engine
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
